<html>
<head>
    <title>Testing Facility / A.C.A.S</title>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="board.css"/>
    <script src="../assets/js/globals.js"></script>
    <script type="module" src="../assets/js/misc/exposeModules.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
    <link rel="stylesheet" type="text/css" href="../../assets/css/chessground.base.css"/>
    <link rel="stylesheet" type="text/css" href="../../assets/css/chessground.brown.css"/>
    <link rel="stylesheet" type="text/css" href="../../assets/css/theme-cburnett.css"/>
    <link rel="stylesheet" type="text/css" href="../../assets/css/theme-merida.css"/>
    <link rel="stylesheet" type="text/css" href="../../assets/css/theme-letters.css"/>
    <link rel="stylesheet" type="text/css" href="../../assets/css/theme-staunty.css"/>
    <link rel="stylesheet" type="text/css" href="../../assets/css/custom-scroll.css"/>
    <link rel="stylesheet" type="text/css" href="../../assets/css/custom-inputs.css"/>
    <link rel="stylesheet" type="text/css" href="../../assets/css/acas-toast.css"/>

<body class="staunty">
    <header class="top-note">
        <a href="../" target="_blank" class="back-to-acas-link acas-fancy-button" rel="noopener">Back</a>
        <span>A.C.A.S TESTING FACILITY (DEV)</span>
    </header>
    <div id="heap-subheader" class="heap-subheader" aria-label="Page memory usage"></div>
    <div id="tests-root" class="tests-root">
        <div id="left-panel" class="panel" role="main">
            <div id="left-content" class="left-content">
                <!-- Test content is rendered here. Each test is responsible for creating/destroying its own boards inside this element. -->
            </div>
        </div>

        <div id="splitter" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize" aria-label="Resize panels"></div>

        <div id="right-panel" class="panel" role="complementary">
            <div id="controls">
                <h3>Stress Tests</h3>
                <div class="live-controls">
                    <button id="run-short-tests" class="small acas-fancy-button">Run short tests</button>
                    <button id="stop-short-tests" class="small acas-fancy-button" disabled>Stop</button>
                </div>
                <p class="test-desc">3 scenarios per category. A.C.A.S has 3 seconds to reply.</p>
                <div id="short-test-score" role="status"></div>
                <ul id="test-list"></ul>
            </div>
        </div>
    </div>

    <footer class="dev-footer">
        <nav aria-label="Footer">
            <a href="https://github.com/Psyyke/A.C.A.S" target="_blank" rel="noopener">GitHub</a>

            <a href="https://github.com/Hakorr" target="_blank" rel="noopener">Author</a>
            <a href="../../tos" target="_blank" rel="noopener">ToS</a>
            <a href="../../privacy" target="_blank" rel="noopener">Privacy</a>
            <a href="../../#/" target="_blank" rel="noopener">Documentation</a>
        </nav>
    </footer>
    <script type="module" src="index.js"></script>
</body>
