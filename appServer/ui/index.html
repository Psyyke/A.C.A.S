<!DOCTYPE html>
<html>
<head>
    <title>A.C.A.S Calculation Server</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:*; img-src 'self' data: blob:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Local chess engine WebSocket server for A.C.A.S GUI.">
    <link rel="stylesheet" href="./css/bootstrap.css">
    <link rel="stylesheet" href="./css/acas-toast.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/custom-scroll.css">
    <link rel="preload" href="./fonts/Mona-Sans.woff2" as="font" type="font/woff2">
    <link rel="preload" href="./fonts/Rubik.ttf" as="font" type="font/ttf">
    <link rel="preload" href="./fonts/IBMPlexSans.ttf" as="font" type="font/ttf">
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="./favicon.ico"/>
</head>

<body>
<div id="acas-header">
    <a id="acas-logo" class="external" href="https://psyyke.github.io/A.C.A.S/" target="_blank">
        <img id="acas-logo-img" src="./images/logo.png">
        <div id="acas-logo-text-container">
            <div id="acas-logo-main">A.C.A.S<div id="acas-version-tag">v1.1.2</div></div>
            <div id="acas-logo-secondary">Calculation Server</div>
        </div>
    </a>
    <div id="acas-is-free-reminder">
        <span>(´｡• ◡ •｡`) Psst! ♡ ⤵</span>
        <div class="acas-social-actions">
            <a class="header-social-button github-button acas-fancy-button external" href="https://github.com/Psyyke/A.C.A.S" target="_blank" title="Star A.C.A.S on GitHub">
                <i class="bi bi-github"></i>
            </a>
            <a class="header-social-button affiliate-button acas-fancy-button external" href="https://psyyke.github.io/A.C.A.S/contributing/" target="_blank" title="Support A.C.A.S development">
                <i class="bi bi-heart-fill"></i>
            </a>
        </div>
    </div>
</div>
<header id="server-controls">
    <div class="header-buttons-container">
        <div>
            <button id="addEngineBtn" class="acas-fancy-button"><i class="bi bi-plus-lg"></i> ADD ENGINE BINARY</button>
            <input 
                type="file" 
                id="filePicker" 
                accept=".exe, .bin, .so, .dylib, application/octet-stream" 
            />

        </div>
        <button id="stopBtn" class="acas-fancy-button" title="Kill every running engine process"><i class="bi bi-x-lg"></i> KILL ALL ENGINES</button>
        <button id="clearBtn" class="acas-fancy-button"><i class="bi bi-x-lg"></i> CLEAR CACHE</button>
    </div>
    <button id="portSettingsBtn" class="server-info acas-fancy-button" type="button"
        title="Configure the local server port" aria-label="Configure the local server port">
        <div id="statusDot"></div>
        <span id="portDisplay">OFFLINE</span>
    </button>
</header>

<div class="engine-library-heading" id="engine-library-heading">
    <h1>Engine library</h1>
    <span id="engineSummary">0 saved · 0 running</span>
</div>
<div class="engine-grid" id="engineGrid" aria-label="Saved chess engines"></div>
<div id="console-toolbar">
    <button id="panelsToggle" class="acas-fancy-button" type="button" aria-expanded="true"
        aria-controls="acas-header server-controls engine-library-heading engineGrid"
        aria-label="Collapse panels" title="Collapse panels">
        <i class="bi bi-chevron-up" aria-hidden="true"></i>
    </button>
</div>
<div id="consoles-container"></div>

<div id="acas-toast-container"></div>
<dialog id="portSettingsDialog" class="prompt-dialog" aria-labelledby="portSettingsLabel" aria-describedby="portSettingsHint">
    <form method="dialog" id="portSettingsForm">
        <label id="portSettingsLabel" for="serverPortInput">Local server port</label>
        <input id="serverPortInput" type="number" min="1" max="65535" step="1" style="width: 90%; margin-bottom: 1em;" required aria-describedby="portSettingsHint" />
        <p id="portSettingsHint" class="port-settings-hint">Saving a new port restarts the app and stops all running engines. Set the same server port in the A.C.A.S web GUI's external engine settings to reconnect.</p>
        <menu style="display:flex; justify-content:flex-end; gap: 0.5em;">
            <button id="portSettingsCancel" class="acas-fancy-button" style="padding: 8px 15px;" type="button">Cancel</button>
            <button id="portSettingsSave" class="acas-fancy-button" style="padding: 8px 15px;" type="submit" value="save">Save &amp; Restart</button>
        </menu>
    </form>
</dialog>
<script src="./libs/acasToast.js"></script>
<script src="./libs/acasPrompt.js"></script>

<script src="./js/utils.js"></script>
<script src="./js/console.js"></script>
<script src="./index.js"></script>

</body>
</html>
